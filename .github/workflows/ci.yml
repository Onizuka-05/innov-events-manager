name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validation:
    name: validation (${{ matrix.application }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: api
            chemin: services/api
          - application: web
            chemin: apps/web
          - application: mobile
            chemin: apps/mobile
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.chemin }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Installer Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.chemin }}/package-lock.json

      - name: Installer les dependances
        run: |
          npm ci
          mkdir -p artifacts

      - name: PostgreSQL jetable pour les tests API
        if: matrix.application == 'api'
        run: |
          docker run -d --name j7-postgres -e POSTGRES_PASSWORD=test-ci -e POSTGRES_DB=innov_events_tests -p 5432:5432 postgres:16.15-alpine
          for i in {1..30}; do
            if docker exec j7-postgres pg_isready -U postgres -d innov_events_tests; then break; fi
            sleep 1
          done
          docker exec j7-postgres pg_isready -U postgres -d innov_events_tests

      - name: Installer nginx pour les tests de falsification
        if: matrix.application == 'api'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          echo "NGINX_BIN=$(command -v nginx)" >> "$GITHUB_ENV"

      - name: Controle de formatage
        run: npm run format:check 2>&1 | tee artifacts/format.log

      - name: Lint JSON et journal
        if: success() || failure()
        run: npm run lint -- --format json --output-file artifacts/lint.json 2>&1 | tee artifacts/lint.log

      - name: Verification TypeScript
        if: success() || failure()
        run: npm run typecheck 2>&1 | tee artifacts/types.log

      - name: Tests et couverture
        if: success() || failure()
        env:
          TEST_DATABASE_URL: ${{ matrix.application == 'api' && 'postgresql://postgres:test-ci@localhost:5432/innov_events_tests' || '' }}
        run: npm run test:coverage 2>&1 | tee artifacts/tests.log

      - name: Build
        if: success() || failure()
        run: npm run build 2>&1 | tee artifacts/build.log

      - name: Audit des dependances de production
        if: success() || failure()
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee artifacts/audit.log

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapports-${{ matrix.application }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ matrix.chemin }}/artifacts/
            ${{ matrix.chemin }}/coverage/

