server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self'; img-src 'self' https: data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto ${NGINX_SCHEME};
    proxy_set_header X-Forwarded-For ${NGINX_CLIENT_IP_SOURCE};
    proxy_set_header X-Real-IP ${NGINX_CLIENT_IP_SOURCE};
    proxy_set_header X-Innov-Client-Ip ${NGINX_CLIENT_IP_SOURCE};
    # L'API utilise exclusivement X-Innov-Client-Ip.
    proxy_set_header CF-Connecting-IP "";
    # Toujours ecraser cet en-tete, meme si le navigateur l'a fourni.
    proxy_set_header X-Innov-Proxy-Secret ${INTERNAL_PROXY_SECRET};
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_connect_timeout 15s;
    proxy_read_timeout 90s;
    proxy_redirect off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

